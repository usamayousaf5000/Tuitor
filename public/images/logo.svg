  <rect x="15" y="15" width="25" height="45" fill="black" rx="2"/>
  <rect x="5" y="15" width="45" height="12" fill="black" rx="2"/>
  
  <!-- H -->
  <rect x="60" y="15" width="12" height="45" fill="#3B82F6" rx="2"/>
